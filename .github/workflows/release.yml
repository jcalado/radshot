name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: at168shot.exe
            release_name: at168shot-windows-x86_64.exe
          - os: ubuntu-latest
            artifact: at168shot
            release_name: at168shot-linux-x86_64
          - os: macos-latest
            artifact: at168shot
            release_name: at168shot-macos-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libxkbcommon-dev \
            libwayland-dev \
            wayland-protocols

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Find artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path build -Recurse -Filter "at168shot.exe" | Select-Object -First 1
          if (!$exe) {
            Write-Error "Build failed - at168shot.exe not found"
            exit 1
          }
          Copy-Item $exe.FullName -Destination at168shot.exe
          $size = (Get-Item at168shot.exe).Length
          Write-Host "Build successful: at168shot.exe ($size bytes)"

      - name: Find artifact (Unix)
        if: runner.os != 'Windows'
        run: |
          if [ ! -f build/at168shot ]; then
            echo "Build failed - at168shot not found"
            exit 1
          fi
          cp build/at168shot at168shot
          chmod +x at168shot
          echo "Build successful: at168shot ($(stat -c%s at168shot 2>/dev/null || stat -f%z at168shot) bytes)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.release_name }}
          path: ${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release
          cp artifacts/at168shot-windows-x86_64.exe/at168shot.exe release/at168shot-windows-x86_64.exe
          cp artifacts/at168shot-linux-x86_64/at168shot release/at168shot-linux-x86_64
          cp artifacts/at168shot-macos-arm64/at168shot release/at168shot-macos-arm64
          chmod +x release/at168shot-linux-x86_64
          chmod +x release/at168shot-macos-arm64

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: AT168Shot ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release/at168shot-windows-x86_64.exe
            release/at168shot-linux-x86_64
            release/at168shot-macos-arm64
